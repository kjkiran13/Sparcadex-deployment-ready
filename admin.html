<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sparcadex Admin</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Arial,sans-serif;background:#07101d;color:#eef6ff}
button,input{font:inherit}
.wrap{max-width:1200px;margin:auto;padding:28px}
.card{background:#0d1a2b;border:1px solid #1d3552;border-radius:18px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
h1{margin:0 0 8px;font-size:30px}
.muted{color:#91a8bf}
.login{max-width:480px;margin:12vh auto}
input{width:100%;padding:13px 14px;border-radius:10px;border:1px solid #2b4664;background:#081423;color:white;outline:none;margin:10px 0 14px}
button{border:0;border-radius:10px;padding:12px 16px;background:#168cff;color:white;cursor:pointer;font-weight:700}
button.danger{background:#c83f55}
button.secondary{background:#203650}
.hidden{display:none}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:20px 0}
.stat{padding:18px;background:#091626;border:1px solid #1d3552;border-radius:14px}
.stat strong{font-size:28px;display:block;margin-top:5px}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:14px 10px;border-bottom:1px solid #1d3552;vertical-align:top}
th{color:#8fb0cf;font-size:13px;text-transform:uppercase}
.msg{max-width:350px;white-space:pre-wrap;color:#c6d6e7}
.actions button{padding:8px 11px;font-size:12px}
.error{color:#ff7d8e;margin:10px 0}
.success{color:#6ee7a1;margin:10px 0}
@media(max-width:700px){.wrap{padding:14px}.stats{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div id="login" class="wrap login">
  <div class="card">
    <h1>Sparcadex Admin</h1>
    <p class="muted">Secure inquiry dashboard</p>
    <label>Admin Key</label>
    <input id="key" type="password" placeholder="Enter admin key" autocomplete="current-password">
    <button id="loginBtn">Sign in</button>
    <div id="loginMsg"></div>
  </div>
</div>

<div id="dashboard" class="wrap hidden">
  <div class="top">
    <div>
      <h1>Inquiry Dashboard</h1>
      <div class="muted">Sparcadex Solutions</div>
    </div>
    <div>
      <button class="secondary" id="refreshBtn">Refresh</button>
      <button class="secondary" id="logoutBtn">Logout</button>
    </div>
  </div>

  <div class="stats">
    <div class="stat"><span class="muted">Total inquiries</span><strong id="total">0</strong></div>
    <div class="stat"><span class="muted">Latest inquiry</span><strong id="latest">—</strong></div>
    <div class="stat"><span class="muted">System</span><strong id="system">Checking</strong></div>
  </div>

  <div class="card">
    <div id="status"></div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Date</th><th>Name</th><th>Contact</th><th>Company</th>
            <th>Project</th><th>Message</th><th>Action</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
let adminKey = sessionStorage.getItem('sparcadex_admin_key') || '';

const $ = id => document.getElementById(id);

function showDashboard() {
  $('login').classList.add('hidden');
  $('dashboard').classList.remove('hidden');
  loadInquiries();
}

function showLogin() {
  $('dashboard').classList.add('hidden');
  $('login').classList.remove('hidden');
}

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
  }[c]));
}

async function api(url, options = {}) {
  const headers = {
    ...(options.headers || {}),
    'x-admin-key': adminKey
  };
  const response = await fetch(url, {...options, headers});
  const data = await response.json().catch(() => ({}));

  if (!response.ok) {
    throw new Error(data.message || `Request failed (${response.status})`);
  }

  return data;
}

async function loadInquiries() {
  $('status').textContent = 'Loading...';
  $('status').className = 'muted';

  try {
    const data = await api('/api/admin/inquiries');
    $('total').textContent = data.count;

    if (data.inquiries.length) {
      const date = new Date(data.inquiries[0].createdAt);
      $('latest').textContent = date.toLocaleDateString();
    } else {
      $('latest').textContent = 'None';
    }

    $('rows').innerHTML = data.inquiries.map(item => `
      <tr>
        <td>${escapeHtml(new Date(item.createdAt).toLocaleString())}</td>
        <td><strong>${escapeHtml(item.name)}</strong></td>
        <td>${escapeHtml(item.email)}<br>${escapeHtml(item.phone)}</td>
        <td>${escapeHtml(item.company || '—')}</td>
        <td>${escapeHtml(item.projectType || '—')}</td>
        <td class="msg">${escapeHtml(item.message)}</td>
        <td class="actions">
          <button class="danger" onclick="deleteInquiry('${escapeHtml(item.id)}')">Delete</button>
        </td>
      </tr>
    `).join('');

    $('status').textContent = data.count ? '' : 'No inquiries yet.';
    $('status').className = data.count ? '' : 'muted';
  } catch (error) {
    $('status').textContent = error.message;
    $('status').className = 'error';

    if (/unauthorized/i.test(error.message)) {
      adminKey = '';
      sessionStorage.removeItem('sparcadex_admin_key');
      showLogin();
    }
  }

  checkHealth();
}

async function deleteInquiry(id) {
  if (!confirm('Delete this inquiry permanently?')) return;

  try {
    await api('/api/admin/inquiries/' + encodeURIComponent(id), {
      method: 'DELETE'
    });
    loadInquiries();
  } catch (error) {
    alert(error.message);
  }
}

async function checkHealth() {
  try {
    const response = await fetch('/api/health');
    const data = await response.json();
    $('system').textContent = data.database === 'connected' ? 'Online' : 'DB issue';
  } catch {
    $('system').textContent = 'Offline';
  }
}

$('loginBtn').addEventListener('click', async () => {
  const key = $('key').value.trim();

  if (!key) {
    $('loginMsg').textContent = 'Enter your admin key.';
    $('loginMsg').className = 'error';
    return;
  }

  adminKey = key;
  sessionStorage.setItem('sparcadex_admin_key', key);

  try {
    await api('/api/admin/inquiries');
    $('loginMsg').textContent = '';
    showDashboard();
  } catch (error) {
    adminKey = '';
    sessionStorage.removeItem('sparcadex_admin_key');
    $('loginMsg').textContent = error.message;
    $('loginMsg').className = 'error';
  }
});

$('key').addEventListener('keydown', e => {
  if (e.key === 'Enter') $('loginBtn').click();
});

$('refreshBtn').addEventListener('click', loadInquiries);

$('logoutBtn').addEventListener('click', () => {
  adminKey = '';
  sessionStorage.removeItem('sparcadex_admin_key');
  $('key').value = '';
  showLogin();
});

if (adminKey) showDashboard();
</script>
</body>
</html>
